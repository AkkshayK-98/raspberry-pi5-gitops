apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: menu-bot
  namespace: argocd
spec:
  project: menu-bot
  source:
    repoURL: https://github.com/AkkshayK-98/raspberry-pi5-gitops
    targetRevision: HEAD
    path: argo/apps/menu-bot
  destination:
    server: https://kubernetes.default.svc
    namespace: menu-bot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true